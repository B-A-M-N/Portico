name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Security fixes reported by govulncheck require this patch release.
          go-version: "1.25.13"

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$out"
            exit 1
          fi

      # A subagent declaring a model the harness cannot resolve fails at
      # dispatch, which is indistinguishable from the agent being unavailable —
      # so the policy gate that required it is skipped silently.
      - name: agent definitions
        run: python3 scripts/claude/workflow_gate.py check-agents

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: go test (race, stress x3)
        run: go test -race -count=3 ./...

      - name: vulnerability scan
        # Same pinned version as `make release-check` so the scan means one
        # thing everywhere; a floating @latest can flip a gate on a new release.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: staticcheck
        # Same pinned version as the Makefile's staticcheck target and the
        # release gate (staticcheck-action 2025.1.1).
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck ./...

      # The acceptance matrix cites test names and commands. Nothing checked
      # they were real: its first draft cited four tests that had been renamed
      # and ten commands whose -run patterns matched nothing, and those rows
      # looked authoritative while verifying nothing.
      - name: acceptance matrix
        run: make acceptance

      - name: acceptance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-report
          path: acceptance-report.txt
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build -t portico:test .

      - name: Verify Docker image
        run: |
          # `version` must succeed in any container — it needs no supervisor.
          docker run --rm portico:test version
          # `doctor` without a reachable supervisor must fail with a clear
          # exit code rather than silently succeeding. This is the contract:
          # an isolated container with no running supervisor is not a healthy
          # deployment. Asserting the expected failure prevents a regression
          # where doctor starts returning 0 without actually checking anything.
          if docker run --rm portico:test doctor; then
            echo "FAIL: doctor succeeded without a supervisor (expected exit 8)"
            exit 1
          fi
          echo "OK: doctor failed as expected without a supervisor"
