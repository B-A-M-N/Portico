name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"

      - name: release gate (make release-check)
        # The canonical gate — identical machinery a developer runs locally:
        # fmt, build, vet, staticcheck (pinned), unit + race tests, acceptance
        # matrix, packaged-artifact verification, deterministic PTY e2e,
        # installer + release-tag contracts, govulncheck (pinned), mod tidy.
        # CI restates nothing: if a gate changes here it changes everywhere.
        run: make release-check

  build:
    needs: verify
    name: build (${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"

      - name: build archive
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          make build
          mkdir dist
          tar -C . -czf "dist/portico-${VERSION}-${GOOS}-${GOARCH}.tar.gz" portico
          scripts/verify_release_artifact.sh "dist/portico-${VERSION}-${GOOS}-${GOARCH}.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portico-linux-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: generate checksums
        working-directory: dist
        run: sha256sum portico-*.tar.gz > checksums.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/portico-*.tar.gz
            dist/checksums.txt
