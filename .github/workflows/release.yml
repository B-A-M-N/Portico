name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # id-token: the OIDC identity cosign's keyless signing records in the
  # certificate. Without it there is no provable publisher identity and the
  # installer rightly refuses the release.
  id-token: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.13"

      - name: release gate (make release-check)
        # The canonical gate — identical machinery a developer runs locally:
        # fmt, build, vet, staticcheck (pinned), unit + race tests, acceptance
        # matrix, packaged-artifact verification, deterministic PTY e2e,
        # installer + release-tag contracts, govulncheck (pinned), mod tidy.
        # CI restates nothing: if a gate changes here it changes everywhere.
        run: make release-check

  build:
    needs: verify
    name: build (${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # fetch-depth: 0 — upgrade-check resolves and builds the previous
      # release tag from git; a shallow checkout does not contain prior tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.13"

      - name: build archive
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          make build
          mkdir dist
          tar -C . -czf "dist/portico-${VERSION}-${GOOS}-${GOARCH}.tar.gz" portico
          scripts/verify_release_artifact.sh "dist/portico-${VERSION}-${GOOS}-${GOARCH}.tar.gz"

      # Publication gates against the exact archive this job built. A clean
      # user must be able to install and use it, and an existing installation
      # must survive the upgrade; both run before anything is uploaded.
      - name: clean-user smoke (candidate archive)
        run: ./scripts/clean_user_smoke.sh "dist/portico-${{ github.ref_name }}-linux-${{ matrix.goarch }}.tar.gz"

      - name: validate release tag
        run: scripts/validate_release_tag.sh "${{ github.ref_name }}"

      # CURRENT_RELEASE_TAG guarantees select_prior_release.sh excludes the
      # candidate itself: "upgrade from vX to vX" is vacuous evidence.
      - name: upgrade check (candidate archive)
        run: make upgrade-check PRIOR_BINARY= CANDIDATE_ARCHIVE="dist/portico-${{ github.ref_name }}-linux-${{ matrix.goarch }}.tar.gz" CURRENT_RELEASE_TAG="${{ github.ref_name }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portico-linux-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: generate checksums
        working-directory: dist
        run: sha256sum portico-*.tar.gz > checksums.txt

      # Sign the exact checksums.txt being published. Keyless Sigstore: the
      # OIDC token of this workflow becomes the certificate identity, which is
      # what install.sh verifies (repository + workflow + tag ref). The sig and
      # cert are published beside the artifact so the installer can refuse any
      # release whose publisher cannot be proven.
      - name: sign checksums (Sigstore keyless)
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"
      - name: sign
        working-directory: dist
        run: |
          cosign sign-blob \
            --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt

      # The installer downloads and verifies these exact assets. Publishing
      # archives whose checksums are not the signed ones would be a different,
      # unproven release.
      - name: verify published evidence before upload
        working-directory: dist
        run: |
          cosign verify-blob \
            --certificate-identity-regexp "^https://github.com/B-A-M-N/Portico/.github/workflows/release.yml@refs/tags" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --signature checksums.txt.sig \
            --certificate checksums.txt.pem \
            checksums.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/portico-*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/checksums.txt.pem
